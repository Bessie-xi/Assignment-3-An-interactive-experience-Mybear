<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyBear</title>

  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      box-sizing: border-box;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse at 75% 65%, #665650 0%, transparent 48%),
        linear-gradient(135deg, #303a44 0%, #46515b 48%, #25292c 100%);
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 36px;
    }

    .workspace {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview {
      width: 100%;
      max-width: 1000px;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: calc(100vh - 120px);
      height: calc(100dvh - 120px);
      min-height: 320px;
      background: transparent;
    }
  </style>
</head>

<body>
  <h1>MyBear</h1>

  <main class="workspace">
    <section class="preview">
     <model-viewer
  src="../assets/teddy_bear.glb"
  alt="一只可旋转查看的 3D 小熊"
  camera-controls
  disable-zoom
  disable-pan
  auto-rotate
  shadow-intensity="1">
</model-viewer>
    </section>
  </main>
</body>
</html>
